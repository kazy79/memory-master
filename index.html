<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memory Master</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Hiragino Maru Gothic Pro','Rounded Mplus 1c',sans-serif;
      background:#08090f; color:#fff;
      height:100dvh; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }

    /* ══════════════════════════════════
       TOP / モード選択画面
    ══════════════════════════════════ */
    #mode-screen {
      display:flex; flex-direction:column; align-items:center;
      gap:0; width:100%; padding:0 24px;
    }
    #mode-screen.hidden { display:none; }

    #brain-wrap {
      width:min(54vw, 220px); height:min(54vw, 220px);
      margin-bottom:18px;
      position:relative;
    }
    #brain-svg { width:100%; height:100%; }

    /* ニューラルネット脳アイコン — ドットをランダムにアニメ */
    .brain-dot {
      animation:dotPulse 2.8s ease-in-out infinite;
    }
    .brain-dot:nth-child(2n)   { animation-delay:.4s; }
    .brain-dot:nth-child(3n)   { animation-delay:.9s; }
    .brain-dot:nth-child(4n)   { animation-delay:1.4s; }
    .brain-dot:nth-child(5n)   { animation-delay:1.9s; }
    @keyframes dotPulse {
      0%,100%{ opacity:.4; r:2; }
      50%    { opacity:1;  r:3.5; }
    }
    .brain-line {
      stroke:#1be4c8; stroke-width:.6; opacity:.18;
      animation:linePulse 3.5s ease-in-out infinite;
    }
    .brain-line:nth-child(odd)  { animation-delay:.7s; }
    .brain-line:nth-child(3n)   { animation-delay:1.5s; }
    @keyframes linePulse {
      0%,100%{ opacity:.12; }
      50%    { opacity:.38; }
    }

    .top-title {
      font-size:clamp(1.5rem,6vw,2rem); font-weight:900; letter-spacing:6px;
      background:linear-gradient(90deg,#1be4c8,#a78bfa,#38bdf8);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:4px;
    }
    .top-sub {
      font-size:.72rem; color:#4a5568; letter-spacing:4px; text-transform:uppercase;
      margin-bottom:28px;
    }

    #mode-list { display:flex; flex-direction:column; gap:12px; width:min(92vw, 300px); }

    .mode-btn {
      display:flex; align-items:center; gap:16px;
      padding:16px 20px; border-radius:14px; border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      backdrop-filter:blur(8px);
      cursor:pointer; text-align:left;
      transition:transform .12s, background .12s, border-color .12s;
    }
    .mode-btn:active { transform:scale(.97); }
    .mode-btn.diggy {
      border-color:rgba(212,160,23,.35);
      background:linear-gradient(135deg,rgba(26,26,26,.8),rgba(50,38,4,.8));
    }
    .mode-btn.diggy:hover {
      background:linear-gradient(135deg,rgba(40,30,4,.9),rgba(80,60,8,.9));
      border-color:rgba(212,160,23,.6);
    }

    .mode-icon { font-size:1.6rem; flex-shrink:0; }
    .mode-info { display:flex; flex-direction:column; gap:3px; flex:1; }
    .mode-name { font-size:1rem; font-weight:900; color:#fff; letter-spacing:3px; }
    .mode-desc { font-size:.65rem; color:rgba(255,255,255,.5); letter-spacing:1px; }

    /* ══════════════════════════════════
       ゲーム画面
    ══════════════════════════════════ */
    #game-screen { display:none; flex-direction:column; align-items:center; }
    #game-screen.active { display:flex; }

    #game-header {
      display:flex; align-items:center; width:min(92vw,300px);
      justify-content:flex-start; margin-bottom:4px;
    }
    #back-btn {
      padding:6px 14px; border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      background:transparent; color:#4a5568; font-size:.72rem; cursor:pointer;
      letter-spacing:1px; transition:color .15s, border-color .15s;
    }
    #back-btn:hover { color:#94a3b8; border-color:rgba(255,255,255,.25); }

    #mode-indicator {
      font-size:1.5rem; font-weight:900; letter-spacing:6px;
      text-align:center; width:min(92vw,300px);
      background:linear-gradient(90deg,#d4a017,#ffe066,#d4a017);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:10px;
      position:relative;
      transition:filter .1s;
    }

    /* ── 稲妻 ── */
    #lightning-svg {
      position:fixed; inset:0; pointer-events:none; z-index:500;
      width:100%; height:100%;
      display:none;
    }
    #lightning-svg.strike { display:block; }
    .bolt-main {
      fill:none; stroke:#ffffff; stroke-width:2.5;
      stroke-linecap:round; stroke-linejoin:round;
      filter:url(#boltGlow);
    }
    .bolt-branch {
      fill:none; stroke:#aad4ff; stroke-width:1.2;
      stroke-linecap:round; stroke-linejoin:round;
      filter:url(#boltGlow);
      opacity:.7;
    }
    @keyframes boltFlash {
      0%  { opacity:0; }
      5%  { opacity:1; }
      18% { opacity:.6; }
      25% { opacity:1; }
      40% { opacity:.4; }
      55% { opacity:.9; }
      75% { opacity:.2; }
      100%{ opacity:0; }
    }
    @keyframes boltFlashBg {
      0%,100%{ background:transparent; }
      6%     { background:rgba(160,200,255,.08); }
      26%    { background:rgba(160,200,255,.05); }
    }
    #lightning-svg.strike { animation:boltFlash .55s ease-out forwards; }
    body.lightning-bg     { animation:boltFlashBg .55s ease-out forwards; }

    /* ── 流れ星 ── */
    .shooting-star {
      position:fixed; pointer-events:none; z-index:500;
      width:160px; height:2px; border-radius:1px;
      background:linear-gradient(to right, transparent, #fff 40%, #a8d8ff);
      box-shadow:0 0 6px 2px #ffffffaa;
      transform-origin:left center;
      animation:shootingStar 320ms cubic-bezier(.15,0,.6,1) forwards;
    }
    @keyframes shootingStar {
      0%  { opacity:0; transform:rotate(var(--angle)) translateX(0); }
      6%  { opacity:1; }
      85% { opacity:.9; }
      100%{ opacity:0; transform:rotate(var(--angle)) translateX(var(--dist)); }
    }

    /* ペカ点灯 — ジャグラー色（青星＋ピンクグロー） */
    #mode-indicator.peka {
      animation:pekaTitle .28s steps(1) 3;
    }
    @keyframes pekaTitle {
      0%  {
        -webkit-text-fill-color:#ffffff;
        filter:
          drop-shadow(0 0 4px #ffffff)
          drop-shadow(0 0 12px #ff44cc)
          drop-shadow(0 0 28px #cc00aa)
          drop-shadow(0 0 48px #1a35e8);
      }
      50% {
        -webkit-text-fill-color:transparent;
        filter:none;
      }
    }

    #score-wrap {
      display:flex; gap:32px; margin-bottom:6px;
    }
    .score-box  { text-align:center; }
    .score-label { font-size:.6rem; color:#2d3748; letter-spacing:2px; text-transform:uppercase; }
    .score-val   { font-size:1.9rem; font-weight:900; color:#e2e8f0; line-height:1.1; }
    #best-val    { color:#d4a017; }

    #round-badge {
      font-size:.72rem; font-weight:700; color:#2d3748; letter-spacing:2px;
      min-height:1.2em; margin-bottom:2px; text-transform:uppercase;
    }
    #status {
      font-size:.88rem; font-weight:700; color:#4a5568; letter-spacing:3px;
      min-height:1.4em; text-align:center; margin-bottom:14px;
    }

    /* ── ボード ── */
    #board {
      display:grid;
      grid-template-columns: repeat(2, min(42vw,130px));
      gap:10px;
      margin-bottom:0;
    }

    .btn {
      width:min(42vw,130px); height:min(42vw,130px);
      border:none; cursor:pointer; border-radius:14px;
      transition:filter .06s, transform .06s, box-shadow .06s;
      filter:brightness(.28) saturate(.6);
      box-shadow:none;
    }
    .btn:active  { transform:scale(.95); }
    .btn.lit     {
      filter:brightness(1.1) saturate(1.2);
      transform:scale(1.06);
      box-shadow:0 0 32px 8px currentColor;
    }
    .btn.pressed { filter:brightness(.9); transform:scale(.96); }
    .btn.off     { display:none; }

    #btn-0 { background:radial-gradient(circle at 38% 34%, #6ee7b7, #059669); border-radius:44% 12px 12px 12px; }
    #btn-1 { background:radial-gradient(circle at 62% 34%, #fca5a5, #dc2626); border-radius:12px 44% 12px 12px; }
    #btn-2 { background:radial-gradient(circle at 38% 66%, #93c5fd, #2563eb); border-radius:12px 12px 12px 44%; }
    #btn-3 { background:radial-gradient(circle at 62% 66%, #fde68a, #d97706); border-radius:12px 12px 44% 12px; }
    #btn-4 { background:radial-gradient(circle at 38% 34%, #d8b4fe, #7c3aed); }
    #btn-5 { background:radial-gradient(circle at 62% 34%, #fed7aa, #ea580c); }

    #board.count-5 #btn-4 {
      grid-column: 1 / -1; justify-self:center;
      border-radius:12px 12px 44% 44%;
    }

    /* ── STARTボタン ── */
    #start-wrap { margin-top:28px; }
    #start-btn {
      padding:14px 52px; border-radius:50px;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(8px);
      color:#e2e8f0; font-size:.88rem; font-weight:900; letter-spacing:5px;
      cursor:pointer;
      box-shadow:0 0 0 0 rgba(27,228,200,0);
      transition:background .15s, border-color .15s, box-shadow .15s, transform .1s, opacity .5s;
      opacity:1;
    }
    #start-btn:hover:not(:disabled) {
      background:rgba(27,228,200,.1);
      border-color:rgba(27,228,200,.45);
      box-shadow:0 0 24px 4px rgba(27,228,200,.2);
    }
    #start-btn:active   { transform:scale(.96); }
    #start-btn:disabled { opacity:.25; cursor:default; transform:none; }

    /* ── シェイク ── */
    @keyframes screenShake {
      0%  { transform:translateX(0); }
      12% { transform:translateX(-11px); }
      28% { transform:translateX(11px); }
      44% { transform:translateX(-7px); }
      60% { transform:translateX(7px); }
      78% { transform:translateX(-3px); }
      90% { transform:translateX(3px); }
      100%{ transform:translateX(0); }
    }
    body.shake { animation:screenShake .48s ease; }

    /* ── ボタンDropアニメ ── */
    @keyframes btnDrop {
      0%  { transform:translateY(0)    scale(1);    filter:brightness(.28) saturate(.6); }
      30% { transform:translateY(20px) scale(.91);  filter:brightness(.12) saturate(.3); }
      65% { transform:translateY(10px) scale(.96);  filter:brightness(.22) saturate(.5); }
      100%{ transform:translateY(0)    scale(1);    filter:brightness(.28) saturate(.6); }
    }
    .btn.drop { animation:btnDrop .5s cubic-bezier(.4,0,.6,1) forwards; }

    /* ── 失敗フラッシュ ── */
    @keyframes failFlash {
      0%,100%{ background:#08090f; }
      30%    { background:#1a0505; }
    }
    body.fail { animation:failFlash .5s ease; }

  </style>
</head>
<body>

<script>
// ══════════════════════════════════════════════════════
//  モード定義
// ══════════════════════════════════════════════════════
const MODES = {
  easy: {
    label:'EASY', cls:'easy', colorCount:4,
    speedStart:680, speedMin:520, speedStep:14, gapRatio:0.38,
  },
  normal: {
    label:'NORMAL', cls:'normal', colorCount:5,
    speedStart:480, speedMin:280, speedStep:18, gapRatio:0.32,
  },
  hard: {
    label:'HARD', cls:'hard', colorCount:6,
    speedStart:320, speedMin:160, speedStep:22, gapRatio:0.25,
  },
  diggy: {
    label:'DIGGY-MO', cls:'diggy', colorCount:4,
    speedStart:550, speedMin:320, speedStep:8, gapRatio:0.35,
    audioFiles:[
      'audio01_nah.mp3',
      'audio02_wakeup.wav',
      'audio03_people.wav',
      'audio04_yo.wav',
    ],
    audioLabels:['なー','ウェイクアップ','ピープル','よー'],
  },
};

// ── Audio ─────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
const FREQS  = [329.63, 261.63, 392.00, 523.25, 440.00, 587.33];
const LABELS = ['みどり','あか','あお','きいろ','むらさき','オレンジ'];

// ファイルURLをキャッシュとして保持（毎回 new Audio() で生成）
const _ts = Date.now();
const diggyAudioSrc = MODES.diggy.audioFiles.map(f => f + '?v=' + _ts);
const diggyFailSrc  = 'audio99_ahahahahahah.mp3.mp3?v=' + _ts;

function playTone(id, duration = 0.38) {
  if (currentMode && currentMode.audioFiles) {
    const a = new Audio(diggyAudioSrc[id]);
    a.volume = 0.55;
    a.play().catch(() => {});
    return;
  }
  const osc = AC.createOscillator(), gain = AC.createGain();
  osc.connect(gain); gain.connect(AC.destination);
  osc.type = 'sine'; osc.frequency.value = FREQS[id];
  gain.gain.setValueAtTime(0, AC.currentTime);
  gain.gain.linearRampToValueAtTime(0.55, AC.currentTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + duration);
  osc.start(AC.currentTime); osc.stop(AC.currentTime + duration + 0.05);
}
function playFail() {
  if (currentMode && currentMode.audioFiles) {
    return new Promise(resolve => {
      const a = new Audio(diggyFailSrc);
      a.volume = 0.55;
      a.onended = resolve;
      a.onerror = resolve;
      a.play().catch(resolve);
    });
  }
  [180,140].forEach((hz,i) => {
    const osc = AC.createOscillator(), gain = AC.createGain();
    osc.connect(gain); gain.connect(AC.destination);
    osc.type = 'sawtooth'; osc.frequency.value = hz;
    const t = AC.currentTime + i * 0.22;
    gain.gain.setValueAtTime(0.35, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.start(t); osc.stop(t + 0.22);
  });
}

// ── State ─────────────────────────────────────────────
let currentMode    = null;
let currentModeKey = null;
let sequence = [], playerSeq = [], score = 0;
let best = {};
try { best = JSON.parse(localStorage.getItem('simonBest2') || '{}'); } catch(e) {}
Object.keys(MODES).forEach(m => { if (!best[m]) best[m] = 0; });
let gameActive = false, accepting = false, lastPlayedId = -1;

// ── DOM ───────────────────────────────────────────────
const modeScreen  = document.getElementById('mode-screen');
const gameScreen  = document.getElementById('game-screen');
const board       = document.getElementById('board');
const statusEl    = document.getElementById('status');
const scoreEl     = document.getElementById('score-val');
const bestEl      = document.getElementById('best-val');
const startBtn    = document.getElementById('start-btn');
const roundBadge  = document.getElementById('round-badge');
const modeIndEl   = document.getElementById('mode-indicator');
const backBtn     = document.getElementById('back-btn');
const allBtns     = document.querySelectorAll('.btn');

// ── Screens ───────────────────────────────────────────
function showModeScreen() {
  gameScreen.classList.remove('active');
  modeScreen.classList.remove('hidden');
  gameActive = false; accepting = false;
}
function showGameScreen(modeKey) {
  currentMode    = MODES[modeKey];
  currentModeKey = modeKey;
  modeScreen.classList.add('hidden');
  gameScreen.classList.add('active');

  const count = currentMode.colorCount;
  board.className = 'count-' + count;
  allBtns.forEach(btn => {
    btn.classList.toggle('off', parseInt(btn.dataset.id) >= count);
  });

  modeIndEl.textContent  = currentMode.label;
  modeIndEl.className    = 'mode-indicator';
  bestEl.textContent     = best[modeKey];
  scoreEl.textContent    = 0;
  roundBadge.textContent = '';
  statusEl.textContent   = 'Press START';
  startBtn.disabled      = false;
  sequence = []; playerSeq = []; score = 0;
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => showGameScreen(btn.dataset.mode));
});
backBtn.addEventListener('click', showModeScreen);

// ── Helpers ───────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function calcSpeed() {
  const m = currentMode;
  return Math.max(m.speedMin, m.speedStart - sequence.length * m.speedStep);
}

// ── コンボ検知＆ペカ演出 ─────────────────────────────
const COMBO_PAIR = [1, 2];
function isCombo(prev, curr) {
  return prev === COMBO_PAIR[0] && curr === COMBO_PAIR[1]; // ウェカ→ピポのみ
}
function triggerPeka() {
  modeIndEl.classList.remove('peka');
  void modeIndEl.offsetWidth;
  modeIndEl.classList.add('peka');
  modeIndEl.addEventListener('animationend', () => modeIndEl.classList.remove('peka'), { once: true });

  // 10% の確率で流れ星
  if (Math.random() < 0.10) spawnShootingStar();

  // 独立して10% の確率で稲妻
  if (Math.random() < 0.10) spawnLightning();
}

function spawnLightning() {
  const svg   = document.getElementById('lightning-svg');
  const group = document.getElementById('bolt-group');
  const W = window.innerWidth, H = window.innerHeight;

  // ジグザグパス生成
  function makeBoltPath(startX, steps, spread) {
    let x = startX, y = 0;
    const stepH = H / steps;
    let d = `M ${x} ${y}`;
    const points = [[x, y]];
    for (let i = 1; i <= steps; i++) {
      x += (Math.random() - 0.5) * spread;
      x  = Math.max(10, Math.min(W - 10, x));
      y  = stepH * i;
      d += ` L ${x} ${y}`;
      points.push([x, y]);
    }
    return { d, points };
  }

  const originX = W * (0.2 + Math.random() * 0.6);
  const { d: mainD, points } = makeBoltPath(originX, 14, 70);

  // 枝：メインパスの途中2〜3箇所から短い枝を生やす
  let branchesD = '';
  const branchCount = 2 + Math.floor(Math.random() * 2);
  for (let b = 0; b < branchCount; b++) {
    const idx  = 3 + Math.floor(Math.random() * (points.length - 5));
    const [bx, by] = points[idx];
    const bLen = 40 + Math.random() * 80;
    const bAngle = (Math.random() - 0.5) * 1.2 + (Math.random() > .5 ? 0.6 : -0.6);
    let cx = bx, cy = by, bd = `M ${bx} ${by}`;
    const bSteps = 3 + Math.floor(Math.random() * 3);
    for (let s = 0; s < bSteps; s++) {
      cx += Math.sin(bAngle) * (bLen / bSteps) + (Math.random() - 0.5) * 22;
      cy += Math.cos(bAngle) * (bLen / bSteps);
      bd += ` L ${cx} ${cy}`;
    }
    branchesD += bd + ' ';
  }

  group.innerHTML = `
    <path class="bolt-branch" d="${branchesD}"/>
    <path class="bolt-main"   d="${mainD}"/>
  `;

  svg.classList.remove('strike');
  void svg.offsetWidth;
  svg.classList.add('strike');

  // 背景フラッシュ
  document.body.classList.remove('lightning-bg');
  void document.body.offsetWidth;
  document.body.classList.add('lightning-bg');

  setTimeout(() => {
    svg.classList.remove('strike');
    document.body.classList.remove('lightning-bg');
  }, 600);
}

function spawnShootingStar() {
  const el = document.createElement('div');
  el.className = 'shooting-star';

  const W = window.innerWidth, H = window.innerHeight;
  // 左端のランダムなY位置からスタート
  const startY = H * (0.05 + Math.random() * 0.45);
  const angle  = 8 + Math.random() * 12; // 8〜20度（浅め）
  const dist   = W * 1.3; // 画面幅を超えて横断

  el.style.cssText = `
    left:0; top:${startY}px;
    --angle:${angle}deg;
    --dist:${dist}px;
  `;

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 420);
}

// ── lightUp ───────────────────────────────────────────
function lightUp(id, duration) {
  return new Promise(resolve => {
    if (currentMode && currentMode.audioFiles && isCombo(lastPlayedId, id)) {
      triggerPeka();
    }
    lastPlayedId = id;
    const el = document.getElementById('btn-' + id);
    el.classList.add('lit');
    playTone(id, duration / 1000);
    setTimeout(() => { el.classList.remove('lit'); resolve(); }, duration);
  });
}

// ── Sequence ──────────────────────────────────────────
async function playSequence() {
  accepting = false;
  statusEl.textContent = 'Listen...';
  const speed = calcSpeed();
  for (const id of sequence) {
    await lightUp(id, speed);
    await delay(speed * currentMode.gapRatio);
  }
  statusEl.textContent = 'Your turn!';
  playerSeq = []; accepting = true;
}

async function nextRound() {
  sequence.push(Math.floor(Math.random() * currentMode.colorCount));
  score = sequence.length - 1;
  scoreEl.textContent    = score;
  roundBadge.textContent = `Round ${sequence.length}`;
  lastPlayedId = -1;
  await delay(500);
  await playSequence();
}

async function startGame() {
  if (AC.state === 'suspended') await AC.resume();

  // 全音声をユーザージェスチャー内で unlock（音量0で即停止）
  if (currentMode && currentMode.audioFiles) {
    await Promise.all(diggyAudioSrc.map(src => {
      const a = new Audio(src);
      a.volume = 0;
      return a.play().then(() => a.pause()).catch(() => {});
    }));
  }

  sequence = []; playerSeq = []; score = 0;
  scoreEl.textContent = 0;
  gameActive = true;
  startBtn.style.opacity = '0';
  startBtn.style.visibility = 'hidden';
  await nextRound();
}

// ── Input ─────────────────────────────────────────────
allBtns.forEach(btn => {
  btn.addEventListener('pointerdown', async () => {
    if (!accepting || !gameActive) return;
    const id = parseInt(btn.dataset.id);

    btn.classList.add('pressed');
    playTone(id, 0.32);
    await delay(100);
    btn.classList.remove('pressed');

    playerSeq.push(id);
    const pos = playerSeq.length - 1;

    if (playerSeq[pos] !== sequence[pos]) {
      accepting = false; gameActive = false;

      document.body.classList.add('fail', 'shake');
      setTimeout(() => document.body.classList.remove('fail'), 520);
      setTimeout(() => document.body.classList.remove('shake'), 500);

      allBtns.forEach((b, i) => {
        if (b.classList.contains('off')) return;
        setTimeout(() => {
          b.classList.add('drop');
          setTimeout(() => b.classList.remove('drop'), 560);
        }, i * 60);
      });

      statusEl.textContent = currentMode.audioLabels ? 'Where is the truth?' : 'Wrong!';

      // 音声再生（待たない）＋ 1.8秒後にボタン表示
      const failResult = playFail();
      await delay(1200);

      if (score > best[currentModeKey]) {
        best[currentModeKey] = score;
        bestEl.textContent = score;
        localStorage.setItem('simonBest2', JSON.stringify(best));
        statusEl.textContent = '🏆 New Record!';
        await delay(1200);
      } else {
        statusEl.textContent = 'Where is the truth?';
      }
      roundBadge.textContent = '';
      startBtn.style.visibility = 'visible';
      startBtn.disabled = false;
      requestAnimationFrame(() => { startBtn.style.opacity = '1'; });
      return;
    }

    if (playerSeq.length === sequence.length) {
      accepting = false;
      score = sequence.length;
      scoreEl.textContent  = score;
      statusEl.textContent = '✓ Correct!';
      await delay(700);
      await nextRound();
    }
  });
});

startBtn.addEventListener('click', startGame);
</script>
